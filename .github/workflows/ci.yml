name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: go test
        run: go test ./...

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install poetry
        run: pipx install poetry
      - name: Verify poetry.lock freshness
        run: poetry check --lock
      - name: Install dependencies
        # the bench extra (matplotlib) is optional for consumers; the test suite
        # scores the corpus through pii.bench, so CI installs it.
        run: poetry install --extras bench
      - name: pytest
        run: poetry run pytest tests/ -q
