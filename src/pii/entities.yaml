# algolia-pii entity specification (SSOT)
#
# Language-neutral. Every implementation (Python and Go) builds its
# detectors from this file and is tested against the golden corpus. A change to
# detection behavior is a change here first.
#
# Two layers per deterministic entity:
#   regex      - a BROAD match (cheap, high recall, may over-match)
#   validator  - a checksum/range test that rejects false positives
# A regex-only detector (the baseline) skips validators; a Tier-1 detector
# applies them. The corpus hard-negatives are chosen so this difference is
# visible in precision.
#
# Keyword gate ("Tier 1.5"): an entity whose checksum is too weak to stand alone
# sets requires_context: true, a context_keywords list and a context_window. The
# Tier-1 detector then reports a validated match only when a keyword, as a whole
# word, lies whole inside the context_window characters just before it. Keywords match
# case-insensitively and accent-insensitively (an explicit fold table, identical
# in Python context.py and Go context.go). The entity stays tier: 1 in findings:
# it is deterministic, the gate only narrows where it fires.
#
# Shape: spec/schema/entities.schema.json.

version: 1

entities:
  - name: EMAIL
    tier: 1
    description: Email address.
    # The left lookbehind starts a match only at the head of a local-part run.
    # Without it, a long run with no '@' is rescanned from every offset
    # (quadratic: about 5 s on 100k letters). Matches are unchanged: a match
    # from inside a run reaches the same '@' as one from its head.
    regex: '(?<![A-Za-z0-9._%+-])[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}'
    validator: null
    default_policy: redact

  # National identifiers come before PHONE and CREDIT_CARD: at an exact overlap
  # tie (same span, same score) the entity listed first wins, and these are the
  # more specific reading of the same digits. Their regexes refuse to start or
  # end inside a longer separated digit run ((?<![0-9][ .-]) / (?![ .-][0-9])),
  # so they never claim a fragment of a card, IBAN or phone number.

  - name: FR_NIR
    tier: 1
    description: >-
      French social security number (NIR): sex, birth year and month, place
      (department or 2A/2B for Corsica, then commune), order, then a 2-digit key.
      Compact or grouped with spaces, dots or hyphens (1 99 14 75 001 001 57;
      14 is not a published month code; the validator does not check the month).
    regex: '(?<![0-9A-Za-z])(?<![0-9][ .-])[1278][ .-]?[0-9]{2}[ .-]?[0-9]{2}[ .-]?(?:[0-9]{2}|2[ABab])[ .-]?[0-9]{3}[ .-]?[0-9]{3}[ .-]?[0-9]{2}(?![0-9A-Za-z])(?![ .-][0-9])'
    validator: fr_nir   # key == 97 - (first 13 mod 97), with 2A -> 19 and 2B -> 18
    default_policy: redact

  - name: FR_TAX_ID
    tier: 1
    description: >-
      French tax number (numero fiscal / SPI): 13 digits, the first 0 to 3, the
      last three a check on the first ten. Compact or grouped 2-2-3-3-3.
    regex: '(?<![0-9A-Za-z])(?<![0-9][ .-])[0-3][0-9][ .-]?[0-9]{2}[ .-]?[0-9]{3}[ .-]?[0-9]{3}[ .-]?[0-9]{3}(?![0-9A-Za-z])(?![ .-][0-9])'
    validator: fr_tax_id   # int(first 10) mod 511 == int(last 3)
    default_policy: redact

  # SIRET and SIREN pass Luhn one time in ten, so they are keyword-gated (Tier 1.5).
  - name: FR_SIRET
    tier: 1
    description: >-
      French establishment number (SIRET): the 9-digit SIREN then a 5-digit NIC.
      Luhn over the 14 digits, except La Poste (SIREN 356000000), whose
      establishments use digit sum mod 5 == 0. Reported only after a keyword.
    regex: '(?<![0-9A-Za-z])(?<![0-9][ .-])[0-9]{3}[ .-]?[0-9]{3}[ .-]?[0-9]{3}[ .-]?[0-9]{5}(?![0-9A-Za-z])(?![ .-][0-9])'
    validator: fr_siret
    default_policy: redact
    requires_context: true
    context_window: 40
    context_keywords:
      - siren
      - sirene
      - siret
      - rcs
      - "registre du commerce"
      - "numéro d'entreprise"
      - "numéro d'établissement"
      - "numéro d'identification"
      - immatriculation
      - "company number"
      - "company registration"
      - "business id"

  - name: FR_SIREN
    tier: 1
    description: >-
      French company number (SIREN): 9 digits, Luhn. Compact or grouped 3-3-3.
      Reported only after a keyword.
    regex: '(?<![0-9A-Za-z])(?<![0-9][ .-])[0-9]{3}[ .-]?[0-9]{3}[ .-]?[0-9]{3}(?![0-9A-Za-z])(?![ .-][0-9])'
    validator: fr_siren
    default_policy: redact
    requires_context: true
    context_window: 40
    context_keywords:
      - siren
      - sirene
      - siret
      - rcs
      - "registre du commerce"
      - "numéro d'entreprise"
      - "numéro d'établissement"
      - "numéro d'identification"
      - immatriculation
      - "company number"
      - "company registration"
      - "business id"

  - name: ES_DNI
    tier: 1
    description: >-
      Spanish national identity number (DNI): 8 digits and a control letter,
      letter = TRWAGMYFPDXBNJZSQVHLCKE[number mod 23]. Accepts 99000001C,
      99000001-C and 99.000.001-C. Uppercase letter only, so prose such as
      "99000001 c" stays out.
    regex: '(?<![0-9A-Za-z])(?:[0-9]{8}|[0-9]{2}\.[0-9]{3}\.[0-9]{3})[ -]?[A-Z](?![0-9A-Za-z])'
    validator: es_dni
    default_policy: redact

  - name: ES_NIE
    tier: 1
    description: >-
      Spanish foreigner identity number (NIE): X, Y or Z, 7 digits and a control
      letter; X, Y, Z read as 0, 1, 2, then the DNI letter rule.
    regex: '(?<![0-9A-Za-z])[XYZ][ -]?[0-9]{7}[ -]?[A-Z](?![0-9A-Za-z])'
    validator: es_nie
    default_policy: redact

  - name: PHONE
    tier: 1
    description: Phone number (E.164, FR, or US-style with separators).
    # Groups may be 1..8 digits (e.g. the lone "1" in "+33 1 99 00 12 34"), joined
    # by a single separator. The validator strips separators and applies the
    # digit-count + not-an-IP gate. (Python re supports the lookbehind; the Go
    # detector reproduces the boundary in code -- RE2 has no lookaround.)
    regex: '(?<!\d)(?:\+\d{1,3}[ .-]?)?(?:\(\d{1,4}\)[ .-]?)?\d{1,8}(?:[ .-]\d{1,8}){1,6}(?!\d)'
    validator: phone_digits   # 9..15 digits once separators are stripped, and not a dotted quad
    default_policy: redact

  - name: CREDIT_CARD
    tier: 1
    description: >-
      Payment card number (13-19 digits, optionally grouped with single spaces
      or hyphens), also when an expiry, a CVV or a short reference shares its
      digit run ("4242 4242 4242 4242 12 27", "12 4242 4242 4242 4242").
    # The regex takes a whole digit run (13+ digits, single space or hyphen
    # between digits). The validator step (card_spans in validators.py,
    # creditCardDetector in Go) reports the run when it passes, otherwise
    # windows of whole groups holding 13-19 digits: earliest start, then the
    # longest valid window. A compact run longer than 19 digits has no group
    # boundary inside, so a long numeric id yields no window.
    regex: '(?<![0-9])[0-9](?:[ -]?[0-9]){12,}'
    validator: luhn   # Luhn + issuer prefix (IIN) + network length
    default_policy: reject

  - name: IBAN
    tier: 1
    description: >-
      International Bank Account Number, compact (DE89370400440532013000) or in
      the printed 4-character groups (DE89 3704 0044 0532 0130 00) joined by one
      kind of separator: space, no-break space, thin space, narrow no-break
      space, dot or hyphen. Either case, but not mixed case.
    # A grouped match can swallow a following 4-character word ("... 7034 from");
    # the validator step then cuts it back to the country's IBAN length, at a
    # group boundary (iban_spans in validators.py, ibanDetector in Go).
    regex: '(?<![A-Za-z0-9])[A-Za-z]{2}[0-9]{2}(?:[A-Za-z0-9]{11,30}|(?:[ \u00a0\u2009\u202f.-][A-Za-z0-9]{4}){2,7}(?:[ \u00a0\u2009\u202f.-][A-Za-z0-9]{1,4})?)(?![A-Za-z0-9])'
    # Per-country length + mod-97. Lowercase or grouped forms also need a country
    # in the length table; the uppercase compact form keeps the 15..34 fallback.
    validator: iban_mod97
    default_policy: reject

  - name: IP
    tier: 1
    description: IPv4 address.
    regex: '(?<![\d.])\d{1,3}(?:\.\d{1,3}){3}(?![\d.])'
    validator: ipv4_octets   # each octet 0..255
    default_policy: flag

# Tier-2 entities (PERSON, ADDRESS, ...) are NER-detected and live in a later
# phase. They are listed here for reference; they have no regex/validator.
tier2_entities:
  - name: PERSON
    tier: 2
    description: Person name. Detected by NER, not regex.
    default_policy: flag
  - name: ADDRESS
    tier: 2
    description: Postal address. Detected by NER, not regex.
    default_policy: flag
